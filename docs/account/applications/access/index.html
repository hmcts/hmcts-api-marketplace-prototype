<h2 class="govuk-heading-m">Access to the APIs</h2>
  <div id="application-access" data-access-url="/account/applications//access" data-attempts="" data-interval="">
    <div id="access-pending">
      <div class="govuk-warning-text">
  <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
  <strong class="govuk-warning-text__text">
    <span class="govuk-visually-hidden">Warning</span>
    These credentials will not work yet. Access to the APIs is still being set up, which can take a couple of minutes.
  </strong>
</div>

    </div>
    <p class="govuk-body" id="access-status" role="status" aria-live="polite"></p>
    <form method="post" action="../../../account/applications//access" id="check-access-form" novalidate>
                <button type="submit" class="govuk-button govuk-button--secondary" data-module="govuk-button"                                               id="check-access">
  Check access
</button>
    </form>
  </div>
